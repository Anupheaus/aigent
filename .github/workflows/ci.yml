name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The unpublished Claude Code package is built separately, against the core just built.
      - run: npx tsc -p packages/claude-code
      - run: npx tsc -p packages/claude-code/tsconfig.build.json
      - run: npm pack --dry-run
  bench:
    # The deterministic scripted tier (no model, no network); the bench self-tests also run in `npm test` above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bench -- --tier scripted --label ci
